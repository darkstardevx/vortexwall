[package]
name = "vortexwall"
version = "0.1.0"
edition = "2021"
description = "Watches auth logs and actively blackholes offending IPs via nftables"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
regex = "1"

[[bin]]
name = "vortexwall"
path = "src/main.rs"
